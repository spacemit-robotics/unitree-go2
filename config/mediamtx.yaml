# MediaMTX v1.20.1 (Fitz8863/spacemit-mediamtx linux/riscv64 release).
# FFmpeg publishes locally; browsers read H.264 over WebRTC.
logLevel: warn
logDestinations: [stdout]
api: true
apiAddress: 127.0.0.1:9997
metrics: false
pprof: false
playback: false
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []
webrtcICEServers2: []
paths:
  camera:
    source: publisher
